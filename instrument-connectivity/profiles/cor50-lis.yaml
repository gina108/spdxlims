id: cor50-lis
name: COR 50 LIS HL7
protocol_hint: hl7_v2
device_metadata:
  vendor: COR
  model: "50"
transport:
  type: tcp_server
  listen_address: 0.0.0.0:5101
  remote_address: 10.0.0.3:5100
  discovery_hints:
    - hl7_listener
parsing:
  strategy: hl7_oru
mapping:
  test_code_aliases:
    TP:
      - "1"
    APTT:
      - "2"
  test_mappings:
    - match_type: exact
      pattern: TP
      component_index: 0
      canonical_assay: Prothrombin Time
      lis_test_id: LIS-PT
      normalized_units: s
    - match_type: exact
      pattern: TP
      component_index: 1
      canonical_assay: Prothrombin Time Activity
      lis_test_id: LIS-PT-PCT
      normalized_units: "%"
    - match_type: exact
      pattern: TP
      component_index: 2
      canonical_assay: ISI
      lis_test_id: LIS-ISI
      normalized_units: ratio
    - match_type: exact
      pattern: TP
      component_index: 3
      canonical_assay: International Normalized Ratio
      lis_test_id: LIS-INR
      normalized_units: ratio
    - match_type: exact
      pattern: TP
      component_index: 4
      canonical_assay: Fibrinogen
      lis_test_id: LIS-FIB
      normalized_units: mg/dL
    - match_type: exact
      pattern: APTT
      canonical_assay: Activated Partial Thromboplastin Time
      lis_test_id: LIS-APTT
      normalized_units: s
    - match_type: exact
      pattern: Testigo
      canonical_assay: Prothrombin Time Control
      lis_test_id: LIS-TESTIGO
      normalized_units: s
  unit_normalization:
    s: s
    "%": "%"
    "Razón": ratio
    RIN: INR
    mg/dL: mg/dL
    mmol/L: mmol/L
learning_mode:
  enabled: true
